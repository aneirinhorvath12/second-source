name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra agent
      - run: uv run ruff check src tests
      - run: uv run pytest
      - name: Offline eval (regression check on the rule baseline)
        run: uv run second-source demo
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: runs/demo/report.md
