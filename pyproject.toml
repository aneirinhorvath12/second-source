[project]
name = "second-source"
version = "0.1.0"
description = "Challenges long-term contract accounting by testing management's estimates against evidence finance doesn't control: the schedule, the contract file and the correspondence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
agent = ["anthropic>=0.40"]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
second-source = "second_source.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_source"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
